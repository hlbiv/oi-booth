# oi-booth default configuration
# Copy to ~/.config/pibooth/pibooth.cfg on the Pi
# Full option reference: https://documentation.pibooth.org

[GENERAL]
# UI language
language = en

# Where to save photos. Set to USB path after running install.sh
# e.g. /media/usb/oi-booth-photos
directory = ~/Pictures/pibooth

# Start booth automatically when Pi boots
autostart = True
autostart_delay = 0

# Enable for verbose logging and to disable the failsafe screen
debug = False

# Load the oi-booth plugin (set full path after install)
plugins = ~/.config/pibooth/plugins/oi_booth_plugin.py


[WINDOW]
# Use 'fullscreen' for events, or a specific size like (1920, 1080)
size = fullscreen

# Background: RGB tuple or path to an image
background = (20, 20, 20)

# Flash the screen white on each capture
flash = True

# Show captures one by one after the session
animate = True
animate_delay = 1.5

# How long to show the final photo before returning to wait screen (0 = skip)
finish_picture_delay = 0

# How long to show previous photo on the wait/idle screen (0 = don't show)
wait_picture_delay = 0

# How long to confirm the selected layout
chosen_delay = 2

# Arrow indicators: bottom, top, hidden, or touchscreen
arrows = bottom
arrows_x_offset = 0

# Preview countdown before capture
preview_delay = 3
preview_countdown = True
preview_stop_on_capture = False


[PICTURE]
# Orientation: auto, portrait, or landscape
orientation = auto

# Which capture counts to offer (users can choose between these)
# Single capture only for a clean, fast experience
captures = (1,)

# Image effect per capture: none, blur, contour, edge_enhance, emboss, sharpen
captures_effects = none

# Crop captures to fill the paper format (removes letterboxing)
captures_cropping = True

# Border thickness in pixels (0 = no border)
margin_thick = 0

# Footer text — supports {date} and {count} variables
footer_text1 =
footer_text2 =

# Text colours as RGB tuples, one per footer line
text_colors = (255, 255, 255), (255, 255, 255)

# Fonts — use system font name or full path to .ttf
text_fonts = Monoid, Monoid

# Text alignment: left, center, or right
text_alignments = center, center

# Overlay PNG to composite over each layout (leave blank for none)
overlays =

# Per-layout backgrounds (image paths or colour tuples)
# Overrides [WINDOW] background for the picture frame
backgrounds = (20, 20, 20)


[CAMERA]
# ISO sensitivity (100 = daylight, 800+ = low light)
iso = 200

# Flip image horizontally (useful if camera is mounted upside-down)
flip = False

# Rotate the capture: 0, 90, 180, or 270
rotation = 0

# Capture resolution — Pi Camera max is (3280, 2464), webcam typically (1920, 1080)
resolution = (1920, 1080)

# Delete photos from camera's internal memory after downloading
delete_internal_memory = False


[PRINTER]
# CUPS printer name — run `lpstat -p` to list available printers
# Leave as 'default' to use the system default printer
printer_name = default

# Printer-specific options dict, e.g. {"fit-to-page": "true"}
printer_options = {}

# How long to show the print screen (seconds, 0 = skip print screen)
printer_delay = 10

# Auto-print N copies after each session (0 = do not auto-print)
auto_print = 0

# Max duplicate prints allowed for the same photo (0 = unlimited)
max_duplicates = 3

# How many copies to tile per printed page
pictures_per_page = 1


[CONTROLS]
# How long a button must be held to register (debounce, seconds)
debounce_delay = 0.3

# Max gap between two-button presses to count as simultaneous (seconds)
multi_press_delay = 0.5

# GPIO board pin numbers (BOARD numbering, not BCM)
# Capture button and its LED
picture_btn_pin = 11
picture_led_pin = 7

# Print button and its LED
print_btn_pin = 13
print_led_pin = 15


[OIBOOTH]
# oi-booth web server settings

# Host to bind (0.0.0.0 = accessible from any device on the network)
web_host = 0.0.0.0

# Port for the admin panel and gallery
web_port = 5000

# Photo storage directory (leave blank to use [GENERAL] directory above)
# Set this to your USB mount path, e.g. /media/usb/oi-booth-photos
storage_dir =

# Show QR code overlay on the booth display after each capture
show_qr = True

# How many seconds to display the QR overlay (dismissed early by button press)
qr_duration = 12
