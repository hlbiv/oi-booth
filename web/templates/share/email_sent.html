<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo sent — oi-booth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
    }

    .logo span { color: #f97316; }

    .icon {
      width: 64px;
      height: 64px;
      background: #14532d;
      border: 1px solid #166534;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .icon svg {
      width: 30px;
      height: 30px;
      stroke: #86efac;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .sub {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 0.4rem;
    }

    .email-highlight {
      font-size: 0.95rem;
      color: #f97316;
      font-weight: 500;
      margin-bottom: 2rem;
      word-break: break-all;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 1.5rem 0;
    }

    .hint {
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 1.5rem;
    }

    .btn-gallery {
      display: inline-block;
      background: #2a2a2a;
      color: #ccc;
      text-decoration: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    .btn-gallery:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">oi<span>-booth</span></div>

    <div class="icon">
      <!-- checkmark -->
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1>Check your inbox</h1>
    <p class="sub">Your photo is on its way to</p>
    <p class="email-highlight">{{ email }}</p>

    <hr class="divider">

    <p class="hint">Didn't get it? Check your spam folder, or try again.</p>

    <a href="/gallery" class="btn-gallery">Back to gallery</a>
  </div>
</body>
</html>
