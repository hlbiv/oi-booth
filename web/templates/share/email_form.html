<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get your photo — oi-booth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
    }

    .logo span { color: #f97316; }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .sub {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 2rem;
    }

    .error {
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 0.4rem;
      text-align: left;
    }

    input[type="email"] {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      width: 100%;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="email"]:focus {
      border-color: #f97316;
    }

    input[type="email"]::placeholder {
      color: #555;
    }

    button[type="submit"] {
      width: 100%;
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button[type="submit"]:hover {
      opacity: 0.88;
    }

    button[type="submit"]:active {
      opacity: 0.75;
    }

    .back {
      display: inline-block;
      margin-top: 1.5rem;
      color: #555;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s;
    }

    .back:hover { color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">oi<span>-booth</span></div>

    <h1>Get your photo</h1>
    <p class="sub">We'll send your photo straight to your inbox.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/share/email/{{ session_id }}">
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required
        autocomplete="email"
        inputmode="email"
      >
      <button type="submit">Send my photo</button>
    </form>

    <a href="/gallery" class="back">Back to gallery</a>
  </div>
</body>
</html>
