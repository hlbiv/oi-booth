<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}oi-booth{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
    }

    nav {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 56px;
    }

    nav .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      letter-spacing: -0.02em;
    }

    nav .brand span { color: #f97316; }

    nav a {
      color: #999;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.15s;
    }

    nav a:hover, nav a.active { color: #fff; }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .flash-messages { margin-bottom: 1.5rem; }

    .flash {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .flash.success { background: #14532d; color: #86efac; border: 1px solid #166534; }
    .flash.error   { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; color: #fff; }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: #ccc; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #f97316; color: #fff; }
    .btn-danger  { background: #dc2626; color: #fff; }
    .btn-ghost   { background: #2a2a2a; color: #ccc; }

    input[type="text"], input[type="file"], select {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e8e8e8;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      width: 100%;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 0.3rem;
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .form-row .field { flex: 1; min-width: 140px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    .stat {
      text-align: center;
      padding: 1rem;
      background: #111;
      border-radius: 8px;
      border: 1px solid #222;
    }

    .stat .value { font-size: 2rem; font-weight: 700; color: #f97316; }
    .stat .label { font-size: 0.75rem; color: #666; margin-top: 0.25rem; }

    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .asset-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      background: #111;
    }

    .asset-item img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      display: block;
    }

    .asset-item .asset-name {
      font-size: 0.7rem;
      color: #888;
      padding: 0.3rem 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .asset-item .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(220,38,38,0.85);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <span class="brand">oi<span>-booth</span></span>
    <a href="/admin" {% if request.path.startswith('/admin') and not request.path.startswith('/admin/logs') %}class="active"{% endif %}>Admin</a>
    <a href="/admin/logs" {% if request.path.startswith('/admin/logs') %}class="active"{% endif %}>Logs</a>
    <a href="/gallery">Gallery</a>
    <a href="/health">Status</a>
  </nav>

  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, msg in messages %}
            <div class="flash {{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
