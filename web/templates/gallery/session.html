<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Photo — oi-booth</title>
  <meta name="theme-color" content="#0f0f0f">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      padding: env(safe-area-inset-top, 12px) 1.25rem 0.75rem;
      padding-top: max(env(safe-area-inset-top), 12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { font-size: 0.85rem; font-weight: 700; color: #f97316; letter-spacing: -0.02em; }
    .back-link { color: #555; font-size: 0.8rem; text-decoration: none; }
    .back-link:hover { color: #888; }

    .photo-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 1.25rem;
    }

    .photo-wrap {
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    .photo-wrap img {
      width: 100%;
      border-radius: 14px;
      display: block;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
      transition: transform 0.3s ease;
    }

    .photo-wrap img:hover { transform: scale(1.01); }

    .is-gif .photo-wrap img { border-radius: 14px; }

    .actions {
      padding: 1rem 1.25rem;
      padding-bottom: max(env(safe-area-inset-bottom), 1rem);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .btn-download {
      display: block;
      width: 100%;
      padding: 1rem;
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-download:hover { opacity: 0.9; }

    .btn-share {
      display: none;
      width: 100%;
      padding: 1rem;
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-share:hover { background: #222; }

    .btn-gallery {
      display: block;
      text-align: center;
      color: #444;
      font-size: 0.85rem;
      text-decoration: none;
      padding: 0.4rem;
    }
    .btn-gallery:hover { color: #666; }

    .meta {
      text-align: center;
      padding: 0.5rem 1.25rem 0;
      color: #333;
      font-size: 0.75rem;
    }

    .gif-badge {
      display: inline-block;
      background: #f97316;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      position: absolute;
      top: 10px;
      left: 10px;
    }
  </style>
</head>
<body class="{% if is_gif %}is-gif{% endif %}">
  <div class="top-bar">
    <span class="brand">oi-booth</span>
    <a href="/gallery" class="back-link">← All photos</a>
  </div>

  <div class="photo-stage">
    <div class="photo-wrap">
      {% if is_gif %}
        <span class="gif-badge">{{ 'BOOM' if 'boomerang' in filename else 'GIF' }}</span>
        <img src="/gallery/{{ session_id }}/photo" alt="Animated photo booth picture">
      {% else %}
        <img src="/gallery/{{ session_id }}/photo" alt="Your photo booth picture">
      {% endif %}
    </div>
  </div>

  <p class="meta">{{ taken_at }}</p>

  <div class="actions">
    <a class="btn-download" href="/gallery/{{ session_id }}/photo" download="{{ filename }}">
      ↓ Download
    </a>
    <button class="btn-share" id="shareBtn" onclick="sharePhoto()">
      Share
    </button>
    <a href="/gallery" class="btn-gallery">Browse all photos</a>
  </div>

  <script>
    // Show native share sheet on mobile if available
    if (navigator.share) {
      document.getElementById('shareBtn').style.display = 'block';
    }

    async function sharePhoto() {
      try {
        const res = await fetch('/gallery/{{ session_id }}/photo');
        const blob = await res.blob();
        const ext = '{{ filename }}'.split('.').pop();
        const file = new File([blob], '{{ filename }}', { type: blob.type });
        await navigator.share({
          title: 'My photo booth pic',
          files: [file],
        });
      } catch (e) {
        // Share cancelled or not supported — ignore
      }
    }
  </script>
</body>
</html>
