<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Photo — oi-booth</title>
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="/static/manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      padding: env(safe-area-inset-top, 12px) 1.25rem 0.75rem;
      padding-top: max(env(safe-area-inset-top), 12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { font-size: 0.85rem; font-weight: 700; color: #f97316; letter-spacing: -0.02em; }
    .back-link { color: #555; font-size: 0.8rem; text-decoration: none; }
    .back-link:hover { color: #888; }

    .photo-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 1.25rem;
    }

    .photo-wrap {
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    .photo-wrap img {
      width: 100%;
      border-radius: 14px;
      display: block;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
    }

    .gif-badge {
      display: inline-block;
      background: #f97316;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      position: absolute;
      top: 10px;
      left: 10px;
    }

    .meta {
      text-align: center;
      padding: 0.5rem 1.25rem 0;
      color: #333;
      font-size: 0.75rem;
    }

    .actions {
      padding: 1rem 1.25rem;
      padding-bottom: max(env(safe-area-inset-bottom), 1rem);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.9rem 1rem;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn-primary  { background: #f97316; color: #fff; }
    .btn-secondary { background: #1a1a1a; color: #ccc; border: 1px solid #2a2a2a; }
    .btn-ghost    { background: transparent; color: #444; font-size: 0.85rem; font-weight: 400; padding: 0.4rem; }

    /* Email share panel */
    .email-panel {
      display: none;
      flex-direction: column;
      gap: 0.5rem;
    }
    .email-panel.open { display: flex; }

    .email-row {
      display: flex;
      gap: 0.5rem;
    }

    .email-row input {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: #e8e8e8;
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      outline: none;
    }
    .email-row input:focus { border-color: #f97316; }

    .email-row .btn-send {
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.7rem 1.1rem;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .email-status {
      font-size: 0.8rem;
      text-align: center;
      min-height: 1.2em;
      color: #666;
    }
    .email-status.ok  { color: #22c55e; }
    .email-status.err { color: #ef4444; }
  </style>
</head>
<body class="{% if is_gif %}is-gif{% endif %}">
  <div class="top-bar">
    <span class="brand">oi-booth</span>
    <a href="/gallery" class="back-link">← All photos</a>
  </div>

  <div class="photo-stage">
    <div class="photo-wrap">
      {% if is_gif %}
        <span class="gif-badge">{{ 'BOOM' if 'boomerang' in filename else 'GIF' }}</span>
      {% endif %}
      <img src="/gallery/{{ session_id }}/photo" alt="Your photo booth picture">
    </div>
  </div>

  <p class="meta">{{ taken_at }}</p>

  <div class="actions">
    <!-- Download -->
    <a class="btn btn-primary" href="/gallery/{{ session_id }}/photo" download="{{ filename }}">
      ↓ Save photo
    </a>

    <!-- Native share (mobile) -->
    <button class="btn btn-secondary" id="nativeShareBtn" style="display:none"
            onclick="nativeShare()">
      Share
    </button>

    <!-- Email share toggle -->
    <button class="btn btn-secondary" id="emailToggleBtn"
            onclick="toggleEmail()">
      ✉ Email me this photo
    </button>

    <!-- Email panel -->
    <div class="email-panel" id="emailPanel">
      <div class="email-row">
        <input type="email" id="emailInput" placeholder="you@example.com" inputmode="email">
        <button class="btn-send" id="sendBtn" onclick="sendEmail()">Send</button>
      </div>
      <p class="email-status" id="emailStatus"></p>
    </div>

    <a href="/gallery" class="btn btn-ghost">Browse all photos</a>
  </div>

  <script>
    const SESSION_ID = {{ session_id | tojson }};
    const FILENAME   = {{ filename   | tojson }};

    // ── Native share (mobile) ──────────────────────────────────────────────
    if (navigator.share) {
      document.getElementById('nativeShareBtn').style.display = 'block';
    }

    async function nativeShare() {
      try {
        const res  = await fetch('/gallery/' + SESSION_ID + '/photo');
        const blob = await res.blob();
        const file = new File([blob], FILENAME, { type: blob.type });
        await navigator.share({ title: 'My photo booth pic', files: [file] });
      } catch (e) { /* cancelled or unsupported */ }
    }

    // ── Email share ────────────────────────────────────────────────────────
    function toggleEmail() {
      const panel = document.getElementById('emailPanel');
      const open  = panel.classList.toggle('open');
      if (open) document.getElementById('emailInput').focus();
    }

    async function sendEmail() {
      const email   = document.getElementById('emailInput').value.trim();
      const statusEl = document.getElementById('emailStatus');
      const sendBtn  = document.getElementById('sendBtn');

      if (!email || !email.includes('@')) {
        statusEl.textContent = 'Please enter a valid email address.';
        statusEl.className = 'email-status err';
        return;
      }

      sendBtn.disabled = true;
      statusEl.textContent = 'Sending…';
      statusEl.className = 'email-status';

      try {
        const res  = await fetch('/share/email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: SESSION_ID, email }),
        });
        const data = await res.json();
        if (data.ok) {
          statusEl.textContent = 'Sent! Check your inbox.';
          statusEl.className = 'email-status ok';
          document.getElementById('emailInput').value = '';
        } else {
          statusEl.textContent = data.error || 'Something went wrong.';
          statusEl.className = 'email-status err';
          sendBtn.disabled = false;
        }
      } catch (e) {
        statusEl.textContent = 'Network error — try again.';
        statusEl.className = 'email-status err';
        sendBtn.disabled = false;
      }
    }

    // ── Allow enter key to send ────────────────────────────────────────────
    document.getElementById('emailInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendEmail();
    });

    // ── Register service worker ────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
