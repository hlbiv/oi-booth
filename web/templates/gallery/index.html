{% extends "base.html" %}
{% block title %}Gallery — oi-booth{% endblock %}

{% block content %}
<h1>Recent Photos</h1>
{% if photos %}
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem;">
  {% for photo in photos %}
  <a href="/gallery/{{ photo.stem }}" style="display: block; border-radius: 8px; overflow: hidden; border: 1px solid #2a2a2a;">
    <img src="/gallery/{{ photo.stem }}/photo" style="width: 100%; height: 150px; object-fit: cover; display: block;">
    <div style="padding: 0.4rem 0.5rem; font-size: 0.7rem; color: #555;">{{ photo.name }}</div>
  </a>
  {% endfor %}
</div>
{% else %}
<div class="card">
  <p style="color: #555; text-align: center; padding: 2rem 0;">No photos yet.</p>
</div>
{% endif %}
{% endblock %}
