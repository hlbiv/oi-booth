{% extends "base.html" %}

{% block title %}Lighting Controls — oi-booth{% endblock %}

{% block head %}
<style>
  .led-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-bottom: 1.5rem;
  }

  @media (max-width: 540px) {
    .led-grid { grid-template-columns: 1fr; }
  }

  .led-card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .led-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .led-indicator {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #333;
    border: 2px solid #444;
    flex-shrink: 0;
    transition: background 0.2s, box-shadow 0.2s;
  }

  .led-indicator.state-on {
    background: #f97316;
    border-color: #f97316;
    box-shadow: 0 0 10px 3px rgba(249,115,22,0.55);
  }

  .led-indicator.state-blink {
    background: #f97316;
    border-color: #f97316;
    animation: led-blink 0.6s step-start infinite;
  }

  @keyframes led-blink {
    0%, 100% {
      background: #f97316;
      border-color: #f97316;
      box-shadow: 0 0 10px 3px rgba(249,115,22,0.55);
    }
    50% {
      background: #333;
      border-color: #444;
      box-shadow: none;
    }
  }

  .led-name {
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
  }

  .led-state-label {
    font-size: 0.75rem;
    color: #888;
    margin-left: auto;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .toggle-group {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2a2a2a;
  }

  .toggle-group button {
    flex: 1;
    padding: 0.7rem 0.5rem;
    background: #111;
    border: none;
    border-right: 1px solid #2a2a2a;
    color: #888;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    font-family: inherit;
    touch-action: manipulation;
  }

  .toggle-group button:last-child {
    border-right: none;
  }

  .toggle-group button:hover {
    background: #1e1e1e;
    color: #ccc;
  }

  .toggle-group button.active-on {
    background: #f97316;
    color: #fff;
  }

  .toggle-group button.active-blink {
    background: #b45309;
    color: #fff;
  }

  .toggle-group button.active-off {
    background: #2a2a2a;
    color: #ccc;
  }

  .global-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .global-actions button {
    flex: 1;
    min-width: 140px;
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
    touch-action: manipulation;
  }

  .global-actions button:hover { opacity: 0.85; }

  .btn-all-off {
    background: #dc2626;
    color: #fff;
  }

  .btn-test-seq {
    background: #2a2a2a;
    color: #ccc;
  }

  .status-bar {
    font-size: 0.8rem;
    color: #555;
    min-height: 1.2em;
    text-align: center;
    margin-top: 0.5rem;
  }

  .status-bar.ok   { color: #4ade80; }
  .status-bar.err  { color: #f87171; }
</style>
{% endblock %}

{% block content %}
<h1>Lighting Controls</h1>

<div class="led-grid">
  <!-- Capture LED -->
  <div class="led-card" id="card-capture">
    <div class="led-header">
      <div class="led-indicator {% if led_state.capture == 'on' %}state-on{% elif led_state.capture == 'blink' %}state-blink{% endif %}"
           id="indicator-capture"></div>
      <span class="led-name">Capture LED</span>
      <span class="led-state-label" id="label-capture">{{ led_state.capture | upper }}</span>
    </div>
    <div class="toggle-group">
      <button onclick="sendLed('capture','on')"   data-led="capture" data-action="on"
              class="{% if led_state.capture == 'on' %}active-on{% endif %}">On</button>
      <button onclick="sendLed('capture','blink')" data-led="capture" data-action="blink"
              class="{% if led_state.capture == 'blink' %}active-blink{% endif %}">Blink</button>
      <button onclick="sendLed('capture','off')"  data-led="capture" data-action="off"
              class="{% if led_state.capture == 'off' or led_state.capture == '' %}active-off{% endif %}">Off</button>
    </div>
  </div>

  <!-- Print LED -->
  <div class="led-card" id="card-print">
    <div class="led-header">
      <div class="led-indicator {% if led_state.print_led == 'on' %}state-on{% elif led_state.print_led == 'blink' %}state-blink{% endif %}"
           id="indicator-print"></div>
      <span class="led-name">Print LED</span>
      <span class="led-state-label" id="label-print">{{ led_state.print_led | upper }}</span>
    </div>
    <div class="toggle-group">
      <button onclick="sendLed('print','on')"   data-led="print" data-action="on"
              class="{% if led_state.print_led == 'on' %}active-on{% endif %}">On</button>
      <button onclick="sendLed('print','blink')" data-led="print" data-action="blink"
              class="{% if led_state.print_led == 'blink' %}active-blink{% endif %}">Blink</button>
      <button onclick="sendLed('print','off')"  data-led="print" data-action="off"
              class="{% if led_state.print_led == 'off' or led_state.print_led == '' %}active-off{% endif %}">Off</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>Global Controls</h2>
  <div class="global-actions">
    <button class="btn-all-off" onclick="sendLed('all','off')">All Off</button>
    <button class="btn-test-seq" onclick="runTestSequence()">Test Sequence</button>
  </div>
  <div class="status-bar" id="status-bar">&nbsp;</div>
</div>

<script>
  const STATUS = document.getElementById('status-bar');

  function setStatus(msg, kind) {
    STATUS.textContent = msg;
    STATUS.className = 'status-bar ' + (kind || '');
    if (kind === 'ok') {
      setTimeout(() => { STATUS.textContent = ' '; STATUS.className = 'status-bar'; }, 2500);
    }
  }

  async function sendLed(led, action) {
    try {
      const res = await fetch('/admin/lighting/command', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({led, action})
      });
      const data = await res.json();
      if (data.ok) {
        applyState(led, action);
        setStatus('Command sent: ' + led + ' → ' + action, 'ok');
      } else {
        setStatus('Error: ' + (data.error || 'unknown'), 'err');
      }
    } catch (e) {
      setStatus('Request failed: ' + e.message, 'err');
    }
  }

  function applyState(led, action) {
    const leds = led === 'all' ? ['capture', 'print'] : [led];
    leds.forEach(l => {
      updateIndicator(l, action);
      updateButtons(l, action);
    });
  }

  function updateIndicator(led, action) {
    const el = document.getElementById('indicator-' + led);
    const lbl = document.getElementById('label-' + led);
    if (!el) return;
    el.className = 'led-indicator';
    if (action === 'on')    el.classList.add('state-on');
    if (action === 'blink') el.classList.add('state-blink');
    if (lbl) lbl.textContent = action.toUpperCase();
  }

  function updateButtons(led, action) {
    const group = document.querySelector('[data-led="' + led + '"][data-action="on"]')?.parentElement;
    if (!group) return;
    group.querySelectorAll('button').forEach(btn => {
      btn.className = '';
      if (btn.dataset.action === action) {
        btn.className = action === 'on' ? 'active-on' : action === 'blink' ? 'active-blink' : 'active-off';
      }
    });
  }

  async function runTestSequence() {
    setStatus('Running test sequence...', '');
    await sendLed('all', 'on');
    await delay(800);
    await sendLed('all', 'blink');
    await delay(1800);
    await sendLed('all', 'off');
    setStatus('Test sequence complete.', 'ok');
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // Poll for live state every 4 seconds
  async function pollState() {
    try {
      const res = await fetch('/admin/lighting/api/status');
      const data = await res.json();
      updateIndicator('capture', data.capture || 'off');
      updateButtons('capture', data.capture || 'off');
      updateIndicator('print', data.print_led || 'off');
      updateButtons('print', data.print_led || 'off');
    } catch (_) {}
  }

  setInterval(pollState, 4000);
</script>
{% endblock %}
