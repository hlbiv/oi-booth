{% extends "base.html" %}
{% block title %}Logs — oi-booth{% endblock %}

{% block content %}
<div style="display:flex; align-items:baseline; gap:0.75rem; margin-bottom:1rem;">
  <h1 style="margin:0">Booth Logs</h1>
  <span id="log-status" style="font-size:0.72rem; color:#555">live</span>
</div>
<div class="card" style="padding:0">
  <pre id="log-output" style="font-size:0.72rem; color:#888; line-height:1.6;
       overflow-x:auto; overflow-y:auto; max-height:72vh;
       margin:0; padding:1rem; white-space:pre-wrap; word-break:break-all;">{% for line in lines %}{{ line }}
{% endfor %}</pre>
</div>
<script>
  const pre    = document.getElementById('log-output');
  const status = document.getElementById('log-status');
  let pinned   = true; // auto-scroll while at bottom

  pre.scrollTop = pre.scrollHeight;

  pre.addEventListener('scroll', () => {
    pinned = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
  });

  async function refreshLogs() {
    try {
      const res  = await fetch('/admin/logs/data');
      const data = await res.json();
      pre.textContent = data.lines.join('\n');
      if (pinned) pre.scrollTop = pre.scrollHeight;
      status.textContent = 'live';
      status.style.color = '#22c55e';
    } catch {
      status.textContent = 'error';
      status.style.color = '#ef4444';
    }
  }

  setInterval(refreshLogs, 8000);
</script>
{% endblock %}
